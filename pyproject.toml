[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckgen"
version = "0.1.0"
description = "Automatic presentation generator: topic, outline, or data in -> PowerPoint, HTML and PDF decks out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0",
    "anthropic>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
qa = ["pypdfium2>=4.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
deckgen = "deckgen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deckgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/deckgen/renderers/html_renderer.py" = ["E501"]  # inline HTML/CSS/JS template
